# Generates the snake animation that eats your contribution squares.
# Runs every 12 hours and pushes the result to a branch called "output".
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"     # twice a day
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write               # REQUIRED - without this the push fails

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#8B5CF6

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
